# Netlify production deployment (story c-external-render-service).
# Next.js App Router API routes run as serverless functions (10 s default
# timeout; measured renders need ~1 s). R2 stays on Cloudflare and is reached
# over its S3-compatible API — no Cloudflare Worker build step here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # R2 bucket names are public identifiers (they also appear in wrangler.jsonc
  # and build output), not secrets: exclude them from secrets scanning while
  # keeping the scan active for real credentials (keys, admin password).
  SECRETS_SCAN_OMIT_KEYS = "R2_TEMPLATES_BUCKET,R2_RENDERS_BUCKET"
